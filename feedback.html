<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Faculty of Engineering</title>
    
    <style>
        /* Base Theme Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Top Bar */
        .top-bar {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 2px solid #38bdf8;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .top-bar h1 {
            margin: 0;
            font-size: 2.5em;
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* Navigation */
        .top-nav {
            background-color: #1e293b;
            padding: 15px 0;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .top-nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 30px;
        }

        .top-nav li {
            display: inline;
        }

        .top-nav a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .top-nav a:hover, .top-nav a.active {
            background-color: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }

        #home-sign-out-btn { color: #f43f5e; }
        #home-sign-out-btn:hover {
            background-color: #f43f5e;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.5);
        }

        /* Main Content Layout */
        .container {
            max-width: 700px;
            margin: 50px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid #334155;
        }

        .card-title {
            color: #38bdf8;
            font-size: 1.8em;
            margin-top: 0;
            margin-bottom: 10px;
            text-align: center;
        }

        .card-subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 600;
            font-size: 0.95em;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 1em;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #0ea5e9;
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        /* Custom Modal UI */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(15, 23, 42, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #334155;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: translateY(-20px);
            transition: transform 0.3s ease;
        }
        
        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-title {
            color: #f8fafc;
            font-size: 1.4em;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .modal-message {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .modal-btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .modal-btn-primary { background-color: #38bdf8; color: #0f172a; }
        .modal-btn-primary:hover { background-color: #0ea5e9; }
        .modal-btn-danger { background-color: #f43f5e; color: #ffffff; }
        .modal-btn-danger:hover { background-color: #e11d48; }
        .modal-btn-secondary { background-color: #334155; color: #f8fafc; }
        .modal-btn-secondary:hover { background-color: #475569; }

    </style>
</head>
<body>

    <header class="top-bar">
        <h1>Faculty of Engineering - First Semester</h1>
    </header>

    <nav class="top-nav">
        <ul>
            <li><a href="Home module page.html">Home</a></li>
            <li><a href="my_profile.html">My Profile</a></li>
            <li><a href="about_us.html">About Us</a></li>
            <li><a href="about university.html">About University</a></li>
            <li><a href="#" id="home-sign-out-btn">Sign Out</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <h2 class="card-title">Send Us Feedback</h2>
            <p class="card-subtitle">Help us improve your digital learning experience by sharing your thoughts, reporting bugs, or requesting new features.</p>
            
            <form id="feedback-form">
                <div class="form-group">
                    <label for="feedback-type">Type of Feedback</label>
                    <select id="feedback-type" class="form-control" required>
                        <option value="" disabled selected>Select a category...</option>
                        <option value="suggestion">💡 General Suggestion</option>
                        <option value="bug">🐛 Report a Bug/Issue</option>
                        <option value="feature">✨ Feature Request</option>
                        <option value="other">📝 Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="feedback-message">Your Message</label>
                    <textarea id="feedback-message" class="form-control" placeholder="Tell us what's on your mind in detail..." required></textarea>
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">Submit Feedback</button>
            </form>
        </div>
    </div>

    <!-- Custom Modal UI -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title" class="modal-title">Notification</h3>
            <p id="modal-message" class="modal-message">Message goes here.</p>
            <div id="modal-buttons" class="modal-buttons"></div>
        </div>
    </div>

    <!-- Firebase App JS reference to track login state for the sign-out button -->
    <script type="module" src="app.js"></script>

    <!-- Specific Firebase Script for submitting feedback -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAmigCL0Zv85TGPCnkjnE_33eYpAytDIIA",
            authDomain: "sharkvision-4ac92.firebaseapp.com",
            projectId: "sharkvision-4ac92",
            storageBucket: "sharkvision-4ac92.appspot.com",
            messagingSenderId: "516357464658",
            appId: "1:516357464658:web:b86fe0797e13bd682ef58b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Custom Modal Logic
        const modal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalButtons = document.getElementById('modal-buttons');

        function showMessage(title, message, isSuccess = false) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            modalButtons.innerHTML = `<button class="modal-btn modal-btn-primary" id="modal-ok-btn">OK</button>`;
            modal.classList.add('active');
            
            document.getElementById('modal-ok-btn').onclick = () => {
                modal.classList.remove('active');
                if (isSuccess) {
                    window.location.href = "Home module page.html";
                }
            };
        }

        // Form Submission Logic
        let currentUser = null;
        const feedbackForm = document.getElementById('feedback-form');
        const submitBtn = document.getElementById('submit-btn');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
            } else {
                window.location.replace("index.html");
            }
        });

        feedbackForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentUser) {
                showMessage("Error", "You must be logged in to submit feedback.");
                return;
            }

            const type = document.getElementById('feedback-type').value;
            const message = document.getElementById('feedback-message').value.trim();

            if (!type || !message) {
                showMessage("Missing Info", "Please fill out all fields.");
                return;
            }

            // Disable button during upload to prevent double clicks
            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";

            try {
                // Save the feedback inside the user's private folder so security rules allow it
                const feedbackCollectionRef = collection(db, "users", currentUser.uid, "feedbacks");
                
                await addDoc(feedbackCollectionRef, {
                    type: type,
                    message: message,
                    timestamp: serverTimestamp(),
                    userEmail: currentUser.email,
                    userName: currentUser.displayName || "Unknown"
                });

                feedbackForm.reset();
                showMessage("Thank You!", "Your feedback has been submitted successfully. We appreciate your help!", true);
                
            } catch (error) {
                console.error("Error submitting feedback:", error);
                showMessage("Submission Failed", "There was an error saving your feedback. Please try again.");
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit Feedback";
            }
        });
    </script>
</body>
</html>
