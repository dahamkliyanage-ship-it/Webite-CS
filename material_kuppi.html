
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties of Materials | SharkVision</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }

    /* Website header */
    header {
      background: linear-gradient(110deg, #1e293b, #0f172a);
      text-align: center;
      padding: 32px 15px 28px;
      border-bottom: 1px solid #38bdf8;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }

    /* Navigation bar */
    nav {
      background: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      padding: 12px;
      flex-wrap: wrap;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      padding: 9px 15px;
      border-radius: 5px;
    }

    nav a:hover,
    nav a.active {
      background: #334155;
    }

    /* Main content */
    main {
      max-width: 1000px;
      margin: 70px auto;
      padding: 0 20px;
    }

    .module-title {
      text-align: center;
      color: #38bdf8;
      font-size: 32px;
      margin-bottom: 16px;
    }

    .module-description {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 40px;
    }

    /* Topic sections */
    .topic {
      margin-bottom: 45px;
    }

    .topic h2 {
      font-size: 22px;
      color: #38bdf8;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
      margin-bottom: 25px;
    }

    /* Video grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    /* Video cards */
    .video-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 16px;
      min-width: 0;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .video-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .video-card h3 {
      border-left: 3px solid #38bdf8;
      padding-left: 10px;
      margin: 0 0 14px;
      font-size: 14px;
      line-height: 1.6;
      min-height: 44px;
    }

    .video-card iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      border-radius: 6px;
    }

    .empty {
      color: #94a3b8;
      font-size: 14px;
      font-style: italic;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #94a3b8;
      border-top: 1px solid #334155;
      font-size: 13px;
    }

    /* Responsive layout */
    @media (max-width: 850px) {
      .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      header h1 {
        font-size: 25px;
      }
    }

    @media (max-width: 550px) {
      .video-grid {
        grid-template-columns: 1fr;
      }

      main {
        margin-top: 35px;
      }

      .module-title {
        font-size: 26px;
      }

      nav {
        gap: 5px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Faculty of Engineering - First Semester</h1>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="my_profile.html">My Profile</a>
    <a href="about_us.html">About Us</a>
    <a href="about university.html">About University</a>
  </nav>

  <main>
    <h1 class="module-title">MT1023-Properties of Materials</h1>
    <hr style="border: 0; border-top: 1px solid #334155;">

    <p class="module-description">
      Watch recorded revision sessions directly on the platform.
    </p>

    <div id="topics"></div>
  </main>

  <footer>
    Properties of Materials | Faculty of Engineering
  </footer>

  <script>
    
const topics = [
  {
    name: "Rota Kuppiya | Properties of Materials",
    videos: [
      { title: "mechanical properties", id: "wUC03xwAG78" }
    ]
  },
  {
    name: "Kuppi24 – Properties of Materials - Electrical Properties-part 1",
    videos: [
      { title: "Kuppi24 – Properties of Materials - Electrical Properties-part 1", id: "iN6u5_0SSkY" },
  ]
  },
  {
    name: "Kuppi24 – Properties of Materials - Electrical Properties-part 2",
    videos: [
        { title: "Kuppi24 – Properties of Materials - Electrical Properties-part 2", id: "-i_WYmfXFz4" }
    ]
  },
  {
    name: "Material Nano Technology Kuppi by Omindu",
    videos: [
      { title: "nanotechnology", id: "0EYtsLkGPFU" }
    ]
  },
  {
    name: "Kuppi24 – Properties of Materials - Functional Materials",
    videos: [
      { title: "functional properties", id: "o4DKYcYZ08s" }
    ]
  },
  {
    name: "Kuppi24 – Properties of Materials - Degradation of Materials",
    videos: [
      { title: "Degradation of Materials", id: "-i_WYmfXFz4" }
    ]
  },
  {
    name: "Kuppi24 – Properties of Materials - Material Selection",
    videos: [
      { title: "selection of materials", id: "o4DKYcYZ08s" }
    ]
  }
];


    
const container = document.getElementById("topics");

const grid = document.createElement("div");
grid.className = "video-grid";

topics.forEach((topic) => {
  topic.videos.forEach((video, index) => {
    const card = document.createElement("div");
    card.className = "video-card";

    const title = document.createElement("h3");
    title.textContent =
      topic.name +
      (topic.videos.length > 1 ? ` - Part ${index + 1}` : "");

    const iframe = document.createElement("iframe");
    iframe.src = `https://www.youtube.com/embed/${video.id}`;
    iframe.title = video.title;
    iframe.loading = "lazy";
    iframe.allowFullscreen = true;
    iframe.allow =
      "accelerometer; autoplay; clipboard-write; " +
      "encrypted-media; gyroscope; picture-in-picture";

    card.append(title, iframe);
    grid.appendChild(card);
  });
});

container.appendChild(grid);

  </script>

</body>
</html>
